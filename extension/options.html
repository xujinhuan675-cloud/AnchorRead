<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AnchorRead 扩展设置</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2937;
    }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 16px; }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 8px 18px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      background: #0f766e;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #115e59; }
    #status { margin-left: 10px; font-size: 12px; color: #0f766e; }
    #status.is-error { color: #b91c1c; }
    p.hint { font-size: 12px; color: #6b7280; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>AnchorRead 扩展设置</h1>
  <p class="hint">
    填写你的 AnchorRead 实例地址（本地运行默认 http://localhost:3000）。
    点击工具栏图标打开侧边栏，右键「发送到 AnchorRead」可剪藏当前网页。
  </p>
  <label for="baseUrl">AnchorRead 地址</label>
  <input id="baseUrl" type="url" placeholder="http://localhost:3000" />
  <label for="accessPassword">访问密码（原地解读必需）</label>
  <input id="accessPassword" type="password" placeholder="对应服务端 ACCESS_PASSWORD" autocomplete="off" />
  <p class="hint">
    原地划词解读由扩展调用 AnchorRead 的 /api/explain，走服务端 LLM 配置
    （SERVER_LLM_* 环境变量），因此需要服务端启用访问密码并在此填写。
  </p>
  <label for="apiKey">API Key（可选）</label>
  <input id="apiKey" type="password" placeholder="仅当服务端设置了 ANCHORREAD_API_KEY 时填写" autocomplete="off" />
  <button id="save" type="button">保存并检测连接</button>
  <span id="status" role="status"></span>
  <script src="options.js"></script>
</body>
</html>
