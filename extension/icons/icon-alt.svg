<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 备选款（原正式款）：青绿渐变底 + 白色锚，锚爪化为书页 -->
  <defs>
    <linearGradient id="anchorread-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#anchorread-bg)"/>
  <!-- 锚环 + 锚杆；底部锚爪化为向两侧展开的书页，锚与书共用同一轮廓 -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <circle cx="64" cy="32" r="9"/>
    <path d="M64 41 V101"/>
    <path d="M64 101 C 55 93, 43 89, 31 93"/>
    <path d="M64 101 C 73 93, 85 89, 97 93"/>
  </g>
</svg>
